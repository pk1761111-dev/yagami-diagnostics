<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1020;color:#e8edf7;font-family:system-ui,Roboto,sans-serif;padding:24px}
.box{width:100%;max-width:400px;text-align:center}.logo{width:84px;height:84px;border-radius:22px}h1{letter-spacing:.08em;margin:12px 0 4px;font-size:28px}h1 b{color:#ffc400}
.bar{width:60px;height:3px;background:#ffc400;margin:10px auto 18px;border-radius:2px}p{color:#8d9bb8;line-height:1.5}
input{width:100%;min-height:54px;border-radius:12px;border:1px solid #2f3e61;background:#0e1628;color:#e8edf7;font-size:17px;padding:0 14px;margin:14px 0 10px;outline:none}input:focus{border-color:#ffc400}
button{width:100%;min-height:54px;border:0;border-radius:12px;background:#ffc400;color:#1a1400;font-size:17px;font-weight:700;margin-top:6px}button.sec{background:#18243f;color:#e8edf7;border:1px solid #2f3e61}
.err{color:#ff8a8a;min-height:22px;font-size:14px}.hint{font-size:13px;color:#5f6e8d;margin-top:18px}</style></head>
<body><div class="box">
<img class="logo" src="icon.png" alt=""><h1>YAGAMI <b>AI</b></h1><div class="bar"></div>
<p>Sales &amp; Payment Control<br>Apne CRM server ka link daalein. Ye link Owner ke paas hota hai.</p>
<input id="u" type="url" inputmode="url" autocapitalize="none" autocorrect="off" placeholder="yagami-crm.onrender.com" value="">
<div class="err" id="e"></div>
<button onclick="go()">Connect karein</button>
<div class="hint">Sabhi phones me same link daalein – sabka data ek jagah rahega.</div>
</div>
<script>
function go(){var v=document.getElementById('u').value;var r=YG.saveServer(v);document.getElementById('e').textContent=r;}
document.getElementById('u').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
</script></body></html>
