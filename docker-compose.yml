services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yagami_crm
      POSTGRES_USER: yagami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yagami -d yagami_crm"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://yagami:${POSTGRES_PASSWORD}@db:5432/yagami_crm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # put HTTPS (Caddy/Nginx) in front; see README
    volumes:
      - uploads:/data/uploads

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kolkata
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    # nightly at ~23:30 IST, plus one backup at start-up
    entrypoint: ["/bin/sh", "-c", "sh /backup.sh; while true; do now=$$(date +%H%M); if [ \"$$now\" = \"2330\" ]; then sh /backup.sh; sleep 61; fi; sleep 30; done"]

volumes:
  pgdata:
  uploads:
