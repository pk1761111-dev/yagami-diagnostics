name: Build YAGAMI APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -o "$ZIP" -d _src
          APPDIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          cd "$APPDIR"
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        with:
          name: YAGAMI-Diagnostics-APK
          path: ${{ env.APPDIR }}/app/build/outputs/apk/debug/*.apk
